name: 'Linux (Cross-compile)'

on:
  push:
    branches:
      - 'master'
  pull_request:
    types: [ opened, synchronize ]
  workflow_dispatch:

concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - BuildType: Release
          Platform: aarch64
          Backend: GLFW
          RHI: OpenGL
          CC: gcc
          CXX: g++
          
        - BuildType: Release
          Platform: aarch64
          Backend: SDL2
          RHI: OpenGL
          CC: gcc
          CXX: g++

        - BuildType: Release
          Platform: aarch64
          Backend: SDL2
          RHI: Vulkan
          CC: gcc
          CXX: g++

    runs-on: 'ubuntu-22.04'
    #runs-on: 'ubuntu-22.04-arm'

    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: 'Configure Cross-Compile Support (ARM64)'
      uses: cyberjunk/gha-ubuntu-cross@v5
      with:
        arch: arm64

    - name: 'Create Build Environment'
      run: |
        sudo apt install -y cmake curl
        sudo apt install -y libgl1-mesa-dev:arm64 libglfw3-dev:arm64 libsdl2-dev:arm64 libopenal-dev:arm64 libopenmpt-dev:arm64 libcurl4-openssl-dev:arm64 libssl-dev:arm64 zlib1g:arm64
        #sudo apt install -y libgl1-mesa-dev libglfw3-dev libsdl2-dev libopenal-dev libopenmpt-dev libcurl4-openssl-dev zlib1g

    - name: 'Configure CMake'
      run: |
        export CC=aarch64-linux-gnu-${{ matrix.CC }}
        export CXX=aarch64-linux-gnu-${{ matrix.CXX }}
        #export CC=${{ matrix.CC }}
        #export CXX=${{ matrix.CXX }}
        
        rm -f ./Content/Translations/*.po
        
        # OpenSSL is multiarch: headers are shared under /usr/include (arch-specific opensslconf.h is
        # found via the cross-compiler's /usr/include/aarch64-linux-gnu search), but the libraries must be
        # pinned to the arm64 ones so find_package(OpenSSL) doesn't pick up the host's x86_64 libraries.
        cmake -B ./_build/ -D CMAKE_BUILD_TYPE=${{ matrix.BuildType }} -D CMAKE_SYSTEM_NAME=Linux -D CMAKE_SYSTEM_PROCESSOR=aarch64 -D CMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu -D OPENSSL_INCLUDE_DIR=/usr/include -D OPENSSL_CRYPTO_LIBRARY=/usr/lib/aarch64-linux-gnu/libcrypto.so -D OPENSSL_SSL_LIBRARY=/usr/lib/aarch64-linux-gnu/libssl.so -D NCINE_STRIP_BINARIES=ON -D NCINE_PREFERRED_BACKEND=${{ matrix.Backend }} -D NCINE_PREFERRED_RHI=${{ matrix.RHI }} -D NCINE_WITH_GLEW=OFF
        #cmake -B ./_build/ -D CMAKE_BUILD_TYPE=${{ matrix.BuildType }} -D NCINE_STRIP_BINARIES=ON -D NCINE_PREFERRED_BACKEND=${{ matrix.Backend }} -D NCINE_WITH_GLEW=OFF

    - name: 'Build'
      run: |
        make -j $(nproc) -C ./_build/

    - name: 'Create Package'
      run: |
        mkdir ./_package/
        cp -f ./_build/jazz2 ./_package/jazz2
        cp -f -r ./Content/ ./_package/Content/
        cp -f ./LICENSE ./_package/LICENSE
        
        # Keep the OpenGL artifact names backward-compatible - only non-OpenGL rendering backends are suffixed
        rhiSuffix=""
        if [ "${{ matrix.RHI }}" != "OpenGL" ]; then rhiSuffix="_${{ matrix.RHI }}"; fi
        case "${{ matrix.CC }}" in
          gcc ) artifactPath="Jazz2_Linux_${{ matrix.Platform }}_${{ matrix.Backend }}${rhiSuffix}" ;;
          clang ) artifactPath="Jazz2_Linux_${{ matrix.Platform }}_${{ matrix.Backend }}${rhiSuffix}_Clang" ;;
          * ) artifactPath="Jazz2_Linux_${{ matrix.Platform }}_${{ matrix.Backend }}${rhiSuffix}_${{ matrix.CC }}" ;;
        esac
        echo "artifactPath=$artifactPath" >> $GITHUB_ENV
        
    - name: 'Upload Package'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.artifactPath }}
        path: ./_package/

  Build-AppImage:
    strategy:
      fail-fast: false
      matrix:
        include:
        - BuildType: Release
          Platform: aarch64
          Backend: GLFW
          RHI: OpenGL
          CC: gcc
          CXX: g++
        - BuildType: Release
          Platform: aarch64
          Backend: SDL2
          RHI: OpenGL
          CC: gcc
          CXX: g++
        - BuildType: Release
          Platform: aarch64
          Backend: SDL2
          RHI: Vulkan
          CC: gcc
          CXX: g++

    # Built natively on an arm64 runner (rather than cross-compiled) so the aarch64 linuxdeploy can run to
    # assemble the AppImage without needing qemu
    runs-on: 'ubuntu-22.04-arm'

    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: 'Create Build Environment'
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake curl g++ libgl1-mesa-dev libglew2.2 libglfw3 libsdl2-2.0-0 libopenal1 libvorbisfile3 libopenmpt-dev libcurl4-openssl-dev fuse

    - name: 'Configure CMake'
      run: |
        export CC=${{ matrix.CC }}
        export CXX=${{ matrix.CXX }}

        rm -f ./Content/Translations/*.po

        cmake -B ./_build/ -D CMAKE_BUILD_TYPE=${{ matrix.BuildType }} -D NCINE_STRIP_BINARIES=ON -D NCINE_PREFERRED_BACKEND=${{ matrix.Backend }} -D NCINE_PREFERRED_RHI=${{ matrix.RHI }} -D NCINE_WITH_GLEW=OFF -D NCINE_LINUX_PACKAGE=jazz2 -D NCINE_PACKAGED_CONTENT_PATH=ON -D CMAKE_INSTALL_PREFIX=/usr

    - name: 'Build'
      run: |
        DESTDIR=../_appdir/ make install -j $(nproc) -C ./_build/

    - name: 'Create AppImage'
      run: |
        if [ ! -f linuxdeploy-aarch64.AppImage ]; then
          curl -s -S -O --location 'https://github.com/darealshinji/linuxdeploy-plugin-checkrt/releases/download/continuous/linuxdeploy-plugin-checkrt.sh'
          curl -s -S -O --location 'https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage'
          chmod a+x linuxdeploy-aarch64.AppImage linuxdeploy-plugin-checkrt.sh
        fi

        mv -f ./_appdir/usr/share/jazz2/Content/ ./_appdir/usr/bin/Content/
        rm -f -r ./_appdir/usr/share/jazz2/
        rm -f -r ./_appdir/usr/share/doc/

        LDAI_OUTPUT="./_build/jazz2.AppImage" ARCH=aarch64 ./linuxdeploy-aarch64.AppImage --appdir=./_appdir/ --icon-filename=jazz2 --desktop-file=./_appdir/usr/share/applications/jazz2.desktop --executable=./_appdir/usr/bin/jazz2 --custom-apprun=./Sources/AppRun --output=appimage --plugin checkrt

        rhiSuffix=""
        if [ "${{ matrix.RHI }}" != "OpenGL" ]; then rhiSuffix="_${{ matrix.RHI }}"; fi
        artifactPath="Jazz2_${{ matrix.Platform }}_${{ matrix.Backend }}${rhiSuffix}.AppImage"
        echo "artifactPath=$artifactPath" >> $GITHUB_ENV

    - name: 'Upload Package'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.artifactPath }}
        path: ./_build/jazz2.AppImage