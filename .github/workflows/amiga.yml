name: 'Amiga'

on:
  push:
    branches:
      - 'master'
  pull_request:
    types: [ opened, synchronize ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The two PowerPC systems, which have maintained cross-toolchains in container images - so this job
  # only has to configure and build. Both render through the fixed-function `LegacyGL` backend on the
  # OpenGL 1.x their system provides (MiniGL over Warp3D on AmigaOS 4, TinyGL on MorphOS), which is the
  # default there; neither has been run on hardware, so what this proves is that they build and link.
  PowerPC:
    strategy:
      fail-fast: false
      matrix:
        include:
        - Target: 'AmigaOS 4.1'
          # adtools (ppc-amigaos-gcc 11.5) together with the AmigaOS 4.1 SDK, which is where the
          # prebuilt SDL2, zlib, Vorbis and MiniGL this build links against come from
          Image: 'docker.io/walkero/amigagccondocker:os4-gcc11'
          Toolchain: 'os4.cmake'
          Artifact: 'Jazz2_AmigaOS4'
          BuildType: Release
        - Target: 'MorphOS'
          # The MorphOS SDK (ppc-morphos-gcc 11.3) at /gg. It ships SDL2 and TinyGL but no zlib, which
          # the step below cross-compiles, and no OpenAL - so the SDL audio backend is selected
          Image: 'docker.io/walkero/amigagccondocker:mos-gcc-amd64'
          Toolchain: 'morphos.cmake'
          Artifact: 'Jazz2_MorphOS'
          BuildType: Release

    name: '${{ matrix.Target }}'
    runs-on: 'ubuntu-latest'
    container:
      image: ${{ matrix.Image }}
      # The images define an unprivileged user; the runner's workspace is owned by root
      options: --user root

    env:
      # Where the cross-compiled dependencies below are installed, outside the SDK itself
      MORPHOS_DEPS: '/tmp/morphos-deps'
      ZLIB_VERSION: '1.3.1'

    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: 'Build zlib'
      if: matrix.Target == 'MorphOS'
      run: |
        # The MorphOS SDK ships no zlib and the game cannot run without it (PakFile). -noixemul
        # matches how everything else on this target is built, including the SDK's own SDL2.
        curl -fsSL https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz | tar xz -C /tmp
        cd /tmp/zlib-${ZLIB_VERSION}
        CC=ppc-morphos-gcc CFLAGS='-O2 -noixemul' ./configure --prefix=${MORPHOS_DEPS} --static
        make -j $(nproc) libz.a
        make install

    - name: 'Configure CMake'
      run: |
        rm -f ./Content/Translations/*.po

        git config --global --add safe.directory '*'
        # Without a prebaked console content tree (see Docs/Amiga.dox) the staged directory carries
        # only the repository's base assets and the game boots to the "content missing" message -
        # which still exercises the whole build and the staging step
        cmake -B ./_build/ -D CMAKE_BUILD_TYPE=${{ matrix.BuildType }} -D CMAKE_TOOLCHAIN_FILE=./cmake/toolchains/${{ matrix.Toolchain }} -D NCINE_CONTENT_DIR=./Content

    - name: 'Build'
      run: |
        make -j $(nproc) -C ./_build/

    - name: 'Create Package'
      run: |
        # The "dist" directory is the ready-to-run layout the build stages: the stripped "Jazz2"
        # executable next to its "Content/", which is copied to the machine as it is
        mkdir ./_package/
        cp -r ./_build/dist/. ./_package/
        cp -f ./LICENSE ./_package/LICENSE

    - name: 'Upload Package'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.Artifact }}
        path: ./_package/

  # AmigaOS 3.x (m68k). Like the two above this is a configure-and-build job: AmigaPorts publishes
  # m68k-amigaos-gcc (GCC 16.2) as a prebuilt Linux x86_64 archive, so the cross-compiler is a 61 MB
  # download that unpacks in seconds and nothing here needs caching.
  #
  # That archive also carries everything else this port compiles against - the third-party developer
  # kits CyberGraphX (which Picasso96 implements too) for the window backend and AHI for audio, the
  # vasm the AMMX kernels are assembled with, and zlib, prebuilt for every multilib - so there is no
  # dependency left to cross-compile here.
  Classic:
    strategy:
      fail-fast: false
      matrix:
        include:
        - BuildType: Release

    name: 'AmigaOS 3.x (m68k)'
    runs-on: 'ubuntu-latest'

    env:
      # Where the release archive is unpacked. A home-directory prefix keeps every step free of sudo,
      # and the toolchain is relocatable, so its own build-time prefix does not matter.
      AMIGA_INST: /home/runner/amiga
      AMIGA_GCC_VERSION: '16.2-rc10'

    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: 'Install m68k-amigaos-gcc'
      shell: bash
      run: |
        # cc1/cc1plus link against these dynamically. The runner image already carries them as
        # dependencies of its own GCC, but naming them keeps the job independent of that.
        sudo apt-get -y update
        sudo apt-get -y install libgmp10 libmpc3 libmpfr6 libzstd1

        # --strip-components=1 unpacks the archive's single "m68k-amigaos-gcc-<version>" directory
        # AS the prefix, so AMIGA_INST does not have to spell the version out twice. The Linux asset
        # is named "-x86_64-linux" from v16.2-rc9 on; earlier releases spell it "-Linux-x86_64".
        mkdir -p "${AMIGA_INST}"
        curl -fsSL "https://github.com/AmigaPorts/m68k-amigaos-gcc/releases/download/v${AMIGA_GCC_VERSION}/m68k-amigaos-gcc-${AMIGA_GCC_VERSION}-x86_64-linux.tar.xz" \
          | tar xJ --strip-components=1 -C "${AMIGA_INST}"
        "${AMIGA_INST}/bin/m68k-amigaos-gcc" --version

        # zlib - the one third-party library the game cannot run without - comes with the archive,
        # so nothing is cross-compiled here. It used to be built from source at this point; upstream
        # zlib 1.3.2 cannot be configured with this compiler anyway, because its configure probes
        # -fPIC unconditionally and m68k-amigaos-gcc rejects that flag outright ("use -fbaserel").

    - name: 'Configure CMake'
      shell: bash
      run: |
        rm -f ./Content/Translations/*.po

        git config --global --add safe.directory '*'
        export PATH="${AMIGA_INST}/bin:${PATH}"
        # Without a prebaked console content tree (see Docs/Amiga.dox) the staged directory carries
        # only the repository's base assets and the game boots to the "content missing" message -
        # which still exercises the whole build and the staging step
        cmake -B ./_build/ -D CMAKE_BUILD_TYPE=${{ matrix.BuildType }} -D CMAKE_TOOLCHAIN_FILE=./cmake/toolchains/amiga.cmake -D NCINE_CONTENT_DIR=./Content

    - name: 'Build'
      shell: bash
      run: |
        export PATH="${AMIGA_INST}/bin:${PATH}"
        make -j $(nproc) -C ./_build/

    - name: 'Create Package'
      run: |
        # The staged directory can be copied onto an Amiga hard disk or mounted as an emulator
        # directory-hard-drive as it is
        mkdir ./_package/
        cp -r ./_build/dist/. ./_package/
        cp -f ./LICENSE ./_package/LICENSE

    - name: 'Upload Package'
      uses: actions/upload-artifact@v7
      with:
        name: Jazz2_Amiga
        path: ./_package/
