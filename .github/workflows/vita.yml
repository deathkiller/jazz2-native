name: 'PlayStation Vita'

on:
  push:
    branches:
      - 'master'
  pull_request:
    types: [ opened, synchronize ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - BuildType: Release

    runs-on: 'ubuntu-latest'
    container:
      image: vitasdk/vitasdk:latest
      options: --user root

    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: 'Replace libcurl with the mbedTLS build'
      run: |
        # The SDK's `curl` package is a prebuilt static library linked against `openssl`, which is the
        # 1.0.x port. The catalogue also carries `openssl-1.1.1`, and since that one declares itself a
        # provider of `openssl` it's what the image installs now - but 1.1 renamed the whole `sk_*` stack
        # API to `OPENSSL_sk_*`, turned `SSL_library_init()` and friends into macros and dropped
        # `SSLeay()`, so linking the shipped libcurl against it fails on every one of those symbols.
        # `curl-mbedtls` is the same library built against mbedTLS instead, offered by the catalogue as a
        # drop-in replacement (it declares `provides=curl`), and it needs no OpenSSL at all. The packages
        # are plain tarballs rooted at the target prefix, so they can be unpacked over the installation.
        for PKG in mbedtls curl-mbedtls; do
          curl -fsSL -o "/tmp/${PKG}.tar.xz" "https://github.com/vitasdk/packages/releases/download/master/${PKG}.tar.xz"
          tar xf "/tmp/${PKG}.tar.xz" -C "${VITASDK}/arm-vita-eabi"
        done

    - name: 'Configure CMake'
      run: |
        rm -f ./Content/Translations/*.po

        git config --global --add safe.directory '*'
        cmake -B ./_build/ -D CMAKE_BUILD_TYPE=${{ matrix.BuildType }} -D CMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake

    - name: 'Build'
      run: |
        make -j $(nproc) -C ./_build/

    - name: 'Create Package'
      run: |
        mkdir ./_package/
        cp -f ./_build/jazz2.vpk ./_package/Jazz2.vpk
        cp -f ./LICENSE ./_package/LICENSE

    - name: 'Upload Package'
      uses: actions/upload-artifact@v7
      with:
        name: Jazz2_Vita
        path: ./_package/
