name: 'Nintendo Wii U'

on:
  push:
    branches:
      - 'master'
  pull_request:
    types: [ opened, synchronize ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - BuildType: Release
          RHI: Software

        # Native GX2 backend; its shaders are committed (Gx2GeneratedShaders.h), so CafeGLSL isn't needed here
        - BuildType: Release
          RHI: GX2

    runs-on: 'ubuntu-latest'
    container:
      image: devkitpro/devkitppc:latest
      options: --user root

    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: 'Configure CMake'
      run: |
        rm -f ./Content/Translations/*.po

        git config --global --add safe.directory '*'
        cmake -B ./_build/ -D CMAKE_BUILD_TYPE=${{ matrix.BuildType }} -D CMAKE_TOOLCHAIN_FILE=${DEVKITPRO}/cmake/WiiU.cmake -D NCINE_PREFERRED_RHI=${{ matrix.RHI }}

    - name: 'Build'
      run: |
        make -j $(nproc) -C ./_build/

    - name: 'Create Package'
      run: |
        # The .wuhb bundle contains the executable and the game content, it goes to "sd:/wiiu/apps/"
        mkdir ./_package/
        cp -f ./_build/jazz2.wuhb ./_package/jazz2.wuhb
        cp -f ./LICENSE ./_package/LICENSE

        rhiSuffix=""
        if [ "${{ matrix.RHI }}" != "Software" ]; then rhiSuffix="_${{ matrix.RHI }}"; fi
        echo "rhiSuffix=$rhiSuffix" >> $GITHUB_ENV

    - name: 'Upload Package'
      uses: actions/upload-artifact@v7
      with:
        name: Jazz2_WiiU${{ env.rhiSuffix }}
        path: ./_package/
