name: 'Docker'

on:
  push:
    branches:
      - 'master'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    types: [ opened, synchronize ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the image to the registry as ":edge"'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: 'ghcr.io'
  IMAGE_NAME: '${{ github.repository_owner }}/jazz2-server'

jobs:
  # Runs for every push and pull request, but never pushes anything to the registry - it only
  # verifies that the dedicated server still builds and starts, and publishes the bare binary as
  # an artifact. Only the architecture of the runner is built here.
  Build:
    name: 'Dedicated Server'

    runs-on: 'ubuntu-24.04'

    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v6

    - name: 'Set Up Buildx'
      uses: docker/setup-buildx-action@v3

    - name: 'Build Image'
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: 'jazz2-server:ci'
        cache-from: 'type=gha,scope=amd64'
        cache-to: 'type=gha,mode=max,scope=amd64'

    - name: 'Smoke Test'
      run: |
        # No game data is mounted, so the server must report the missing level and shut down again.
        # That still exercises the whole headless startup path: content verification, asset
        # conversion, configuration parsing and server creation.
        timeout 120 docker run --rm jazz2-server:ci > ./server.log 2>&1 || true
        cat ./server.log
        grep -q 'Server cannot be started because of invalid configuration' ./server.log

    - name: 'Create Package'
      run: |
        mkdir ./_package/
        container=$(docker create jazz2-server:ci)
        docker cp "$container:/app/jazz2" ./_package/Jazz2.Server
        docker rm "$container"
        cp -f ./Docs/Snippets/ServerConfiguration.json ./_package/Jazz2.Server.config
        cp -f ./LICENSE ./_package/LICENSE

    - name: 'Upload Package'
      uses: actions/upload-artifact@v7
      with:
        name: Jazz2_Linux_x64_Server
        path: ./_package/

  # Every architecture is built natively. Each job pushes its own architecture-suffixed
  # tag, which the manifest below then combines into the single tag users pull.
  Publish:
    name: 'Publish (${{ matrix.Architecture }})'
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: Build

    strategy:
      fail-fast: false
      matrix:
        include:
        - Architecture: amd64
          Platform: 'linux/amd64'
          Runner: 'ubuntu-24.04'
        - Architecture: arm64
          Platform: 'linux/arm64'
          # Free ARM runners are available for public repositories
          Runner: 'ubuntu-24.04-arm'

    runs-on: ${{ matrix.Runner }}

    permissions:
      contents: read
      packages: write

    steps:
    - name: 'Checkout Repository'
      uses: actions/checkout@v6

    - name: 'Set Up Buildx'
      uses: docker/setup-buildx-action@v3

    # No secret has to be configured, the automatic token can push to the packages of the same owner
    - name: 'Log In to the Registry'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 'Extract Metadata'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        flavor: |
          latest=false
          suffix=-${{ matrix.Architecture }}
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=edge,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

    - name: 'Build and Push Image'
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ matrix.Platform }}
        push: true
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: 'type=gha,scope=${{ matrix.Architecture }}'
        cache-to: 'type=gha,mode=max,scope=${{ matrix.Architecture }}'

  Merge:
    name: 'Create Manifest'
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: Publish

    runs-on: 'ubuntu-24.04'

    permissions:
      contents: read
      packages: write

    steps:
    - name: 'Set Up Buildx'
      uses: docker/setup-buildx-action@v3

    - name: 'Log In to the Registry'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 'Extract Metadata'
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        flavor: latest=false
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
          type=raw,value=edge,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

    # The architecture-suffixed tags stay in the registry as the sources of this manifest
    - name: 'Create Multi-Architecture Manifest'
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        VERSION: ${{ steps.meta.outputs.version }}
      run: |
        image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
        args=""
        for tag in $TAGS; do args="$args --tag $tag"; done
        docker buildx imagetools create $args "$image:$VERSION-amd64" "$image:$VERSION-arm64"
        docker buildx imagetools inspect "$image:$VERSION"
